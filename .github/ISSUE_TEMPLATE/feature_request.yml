name: Feature request
description: Suggest something new for boxlore
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Ideas from listeners shape the roadmap. Start with the problem you want solved; the best fix may look different from the first one that comes to mind.

        To talk an idea through before it's ready to track, start a discussion in Ideas instead.

  - type: dropdown
    id: area
    attributes:
      label: Which part of boxlore?
      options:
        - Playback
        - Player screen
        - Search & Explore
        - Lore
        - Home & recommendations
        - The boxlore brief
        - Library & downloads
        - Onboarding
        - Widgets
        - Android Auto, Cast & other devices
        - iOS
        - Backend & catalog
        - Analytics
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What should boxlore do?
      description: "Describe the feature as clearly as you can."
      placeholder: "I'd like boxlore to..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: What problem does it solve?
      description: "What do you do today, and what gets in the way?"
      placeholder: "Right now, when I want to..., I have to..."
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups, screenshots or examples
      description: "Sketches, mockups, or how another podcast app handles it."
    validations:
      required: false
