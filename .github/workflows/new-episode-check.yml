name: Check New Episodes

# The checker runs hourly on the VPS (netcup-panel stack/notifier) with its own state file. This
# workflow is a manual fallback only: a live run here uses the repo's older state and would resend
# releases, so it rehearses by default. Turn dry_run off only after copying the VPS state back.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearsal: decide and log, send nothing, save nothing'
        type: boolean
        default: true

concurrency:
  group: tracked-podcast-rtdb-maintenance
  cancel-in-progress: false

jobs:
  check-episodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate boxlore pusher token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOXLORE_PUSHER_APP_ID }}
          private-key: ${{ secrets.BOXLORE_PUSHER_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix scripts

      - name: Test checker logic
        run: npm run test:check-new-episodes --prefix scripts

      - name: Authenticate GCP/Firebase
        run: |
          echo '${{ secrets.FCM_SERVICE_ACCOUNT_KEY }}' > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/gcp-key.json" >> $GITHUB_ENV

      - name: Run New Episode Check
        run: node scripts/check-new-episodes.js
        env:
          PODCAST_INDEX_API_KEY: ${{ secrets.PODCAST_INDEX_API_KEY }}
          PODCAST_INDEX_API_SECRET: ${{ secrets.PODCAST_INDEX_API_SECRET }}
          # Working feed addresses and served episode IDs from the boxlore API (optional).
          BOXLORE_SVC_NOTIFIER_KEY: ${{ secrets.BOXLORE_SVC_NOTIFIER_KEY }}
          NOTIFIER_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      # Runs even when the check failed part-way, so pushes already sent are never sent again.
      - name: Commit & Push State Updates
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add scripts/data/episode-tracker.json
          rm -f gcp-key.json
          git checkout -- . || true
          git clean -fd || true
          git diff --cached --quiet || (git commit -m "chore: update episode tracker state [skip ci]" && git pull --rebase origin master && git push)
