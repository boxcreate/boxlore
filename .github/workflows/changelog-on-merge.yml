name: Changelog and Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: prepare-release
        type: choice
        options:
          - prepare-release
          - publish-release
          - refresh-latest-artifacts
          - refresh-update-feed
      bump:
        description: Version bump for prepare-release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      build_from:
        description: >-
          publish-release: build the merged release commit, or master's tip when a fix merged after
          a failed publication (same version, no new release PR)
        required: true
        default: release-commit
        type: choice
        options:
          - release-commit
          - latest-master
      skip_notify:
        description: >-
          Quiet release — bump the version and publish APK+AAB only; the notes list,
          CHANGELOG and What's New stay as they are and no announcement is drafted
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  update-changelog:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.title, '[skip changelog]') &&
      !startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: boxlore-release-metadata
      # Queue every metadata writer; the default single pending slot drops jobs.
      queue: max
      cancel-in-progress: false
    steps:
      - name: Generate boxlore pusher token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOXLORE_PUSHER_APP_ID }}
          private-key: ${{ secrets.BOXLORE_PUSHER_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - name: Append the merged PR's developer copy to CHANGELOG
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: python3 .github/scripts/update_changelog.py append

      - name: Order authored CHANGELOG bullets
        run: python3 .github/scripts/update_changelog.py sync-changelog

      - name: Render README Upcoming and What's New from the notes
        run: python3 .github/scripts/update_changelog.py sync-readme

      - name: Commit and push changelog update
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- CHANGELOG.md README.md; then
            echo "No CHANGELOG or README changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md
          git commit -m "docs: update CHANGELOG and README for #${PR_NUMBER} [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin master; then
              echo "Pushed CHANGELOG update on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed; rebasing onto latest master (attempt ${attempt})..."
            git pull --rebase origin master
          done

          echo "::error::Failed to push CHANGELOG update after 5 attempts"
          exit 1

      - name: Refresh the update feed's text
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          mkdir -p "$RUNNER_TEMP/update-feed"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir "$RUNNER_TEMP/update-feed"; then
            echo "::warning::Update feed text not refreshed: the latest release has no accessible update feed. Run publication after fixing access or creating the verified feed."
            exit 0
          fi
          git pull --ff-only origin master
          python3 .github/scripts/refresh_update_feed.py --manifest "$RUNNER_TEMP/update-feed/update.json"
          gh release upload "$TAG" "$RUNNER_TEMP/update-feed/update.json" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Updated What's new and Coming next. No APK changed and no notification was sent." >> "$GITHUB_STEP_SUMMARY"

  prepare-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.operation == 'prepare-release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: boxlore-release-preparation
      # Queue every metadata writer; the default single pending slot drops jobs.
      queue: max
      cancel-in-progress: false
    steps:
      - name: Generate boxlore pusher token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOXLORE_PUSHER_APP_ID }}
          private-key: ${{ secrets.BOXLORE_PUSHER_PRIVATE_KEY }}

      - name: Checkout master with release history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve current GitHub Latest release
        id: latest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          latest_tag="$(gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName')"
          if [[ -z "$latest_tag" ]]; then
            echo "::error::No GitHub Latest release was found"
            exit 1
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare the version, notes and release files
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event.inputs.bump }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          SKIP_NOTIFY: ${{ github.event.inputs.skip_notify }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          extra_args=()
          if [[ "$SKIP_NOTIFY" == "true" ]]; then
            extra_args+=(--skip-notify)
          fi
          python3 .github/scripts/prepare_release.py prepare \
            --bump "$BUMP" \
            --latest-tag "$LATEST_TAG" \
            --head-sha "$head_sha" \
            "${extra_args[@]}"

      - name: Validate release diff
        env:
          SKIP_NOTIFY: ${{ steps.release.outputs.skip_notify }}
          NOTES_ARCHIVE: ${{ steps.release.outputs.notes_archive }}
        run: |
          git diff --check
          python3 - <<'PY'
          import os
          import subprocess

          skip = os.environ.get("SKIP_NOTIFY", "").strip().lower() in {"1", "true", "yes"}
          if skip:
              expected_options = [
                  {"app/build.gradle.kts", "README.md"},
                  {"app/build.gradle.kts"},
              ]
          else:
              expected_options = [
                  {
                      "CHANGELOG.md",
                      "README.md",
                      "app/build.gradle.kts",
                      "release-notes/upcoming.md",
                      os.environ["NOTES_ARCHIVE"],
                  }
              ]
          changed = {
              line
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              for line in [line[3:].strip()]
              if line
          }
          if changed not in expected_options:
              raise SystemExit(
                  f"Unexpected release files: {sorted(changed)}; "
                  f"expected one of: {[sorted(x) for x in expected_options]}"
              )
          PY

      - name: Commit and push release branch
        id: push_release
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
          SKIP_NOTIFY: ${{ steps.release.outputs.skip_notify }}
          NOTES_ARCHIVE: ${{ steps.release.outputs.notes_archive }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          if [[ "$SKIP_NOTIFY" == "true" ]]; then
            git add app/build.gradle.kts README.md
            git commit -m "release: prepare ${TAG} [skip changelog] [skip notify]"
          else
            git add app/build.gradle.kts CHANGELOG.md README.md release-notes/upcoming.md "$NOTES_ARCHIVE"
            git commit -m "release: prepare ${TAG} [skip changelog]"
          fi
          git push --set-upstream origin "$BRANCH"

      - name: Open release PR
        id: open_pr
        env:
          # Pusher app has pull_requests:write (org blocks GITHUB_TOKEN from createPullRequest).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_CODE: ${{ steps.release.outputs.current_code }}
          NEW_VERSION: ${{ steps.release.outputs.new_version }}
          NEW_CODE: ${{ steps.release.outputs.new_code }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          MISSING_PRS: ${{ steps.release.outputs.missing_changelog_prs }}
          CHANGELOG_CHECK: ${{ steps.release.outputs.changelog_check }}
          NOTES_ARCHIVE: ${{ steps.release.outputs.notes_archive }}
          APK_ASSET: ${{ steps.release.outputs.apk_asset }}
          AAB_ASSET: ${{ steps.release.outputs.aab_asset }}
          SKIP_NOTIFY: ${{ steps.release.outputs.skip_notify }}
        run: |
          if [[ "$SKIP_NOTIFY" == "true" ]]; then
            title="release: ${TAG} [skip changelog] [skip notify]"
            body="$(cat <<EOF
          ## Quiet release
          - Version: \`${CURRENT_VERSION} (${CURRENT_CODE}) → ${NEW_VERSION} (${NEW_CODE})\`
          - Date: \`${RELEASE_DATE}\`
          - APK asset: \`${APK_ASSET}\`
          - AAB asset: \`${AAB_ASSET}\`

          > The notes list, CHANGELOG and What's New stay as they are and no announcement is
          > drafted on publish. The README APK download badge points at this release.

          ## Before merging
          **Release dry run** builds this commit's optimized APK and Play bundle, with the new version code, and checks them. Merge once it passes.

          ## On merge
          The protected release job builds this merge commit and publishes signed APK/AAB only. If it fails, run **Changelog and Release → publish-release** again: it keeps the version, and \`build_from: latest-master\` builds master once a fix has merged.

          ## Review checklist
          - [ ] Release dry run passed
          - [ ] Gradle version transition is correct
          - [ ] README APK download URL points at \`${APK_ASSET}\`
          - [ ] Only \`app/build.gradle.kts\` and README download URL changed
          EOF
          )"
          else
            # What listeners will read, and the announcement draft publication will prepare from it.
            notes="$(sed '1,2d' "$NOTES_ARCHIVE")"
            announcement="$(TAG="$TAG" NOTES_ARCHIVE="$NOTES_ARCHIVE" python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts")
          import release_notes
          title, body = release_notes.announcement(release_notes.parse(open(os.environ["NOTES_ARCHIVE"]).read()), os.environ["TAG"])
          print(f"**{title}**\n\n{body}")
          PY
          )"
            if [[ "$CHANGELOG_CHECK" == "unknown" ]]; then
              missing_message="> **CHANGELOG coverage not checked:** the merged PRs since the latest release couldn't be listed. Compare them with CHANGELOG by hand if it matters; nothing else is affected."
            elif [[ -n "$MISSING_PRS" ]]; then
              missing_message="> **Not in CHANGELOG:** ${MISSING_PRS}. These merged PRs have no developer entry; add one in this PR if they need it. Nothing else is affected."
            else
              missing_message="Every PR merged since the latest release has a CHANGELOG entry."
            fi
            title="release: ${TAG} [skip changelog]"
            body="$(cat <<EOF
          ## Release
          - Version: \`${CURRENT_VERSION} (${CURRENT_CODE}) → ${NEW_VERSION} (${NEW_CODE})\`
          - Date: \`${RELEASE_DATE}\`
          - APK asset: \`${APK_ASSET}\`
          - AAB asset: \`${AAB_ASSET}\`
          - Listener notes: \`${NOTES_ARCHIVE}\` (the notes list starts afresh for the next release)

          ${missing_message}

          ## What's new, as listeners will read it
          ${notes}

          ## Announcement draft
          ${announcement}

          Edit the wording in \`${NOTES_ARCHIVE}\` and README What's New in this PR if anything needs changing.

          ## Before merging
          **Release dry run** builds this commit's optimized APK and Play bundle, with the new version code, and checks them. Merge once it passes.

          ## On merge
          The protected release job builds this exact merge commit, verifies versions and signing identity, then publishes the signed APK and AAB with checksums. If it fails, run **Changelog and Release → publish-release** again: it keeps the version and skips what is already done, and \`build_from: latest-master\` builds master once a fix has merged.

          ## Review checklist
          - [ ] Release dry run passed
          - [ ] Gradle version transition is correct
          - [ ] What's new reads well, highlights first
          - [ ] The announcement draft is right
          - [ ] Only Gradle, CHANGELOG, README and the release notes files changed
          EOF
          )"
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$BRANCH" \
            --title "$title" \
            --label "no-user-impact" \
            --body "$body"

      - name: Cleanup orphan release branch on failure
        if: failure() && steps.push_release.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: python3 .github/scripts/prepare_release.py cleanup-stale --tag "$TAG"

  # Publication and refresh share this job. Publication builds the merged release commit, or master's
  # tip with build_from=latest-master when a fix merged after a failed publication; either way the
  # version stays the one the release PR set, so nothing is prepared again. Refresh builds master's tip
  # for the Latest release and replaces its files. Re-running is safe: when the release already holds
  # this commit's files, they are reused instead of built again, and every later step is idempotent.
  publish-release:
    if: >-
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/master' &&
        contains(github.event.head_commit.message, '[skip changelog]') &&
        contains(github.event.head_commit.message, 'release: prepare v')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.operation == 'publish-release' ||
          github.event.inputs.operation == 'refresh-latest-artifacts'
        )
      )
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      tag: ${{ steps.release.outputs.tag }}
      skip_notify: ${{ steps.release.outputs.skip_notify }}
      version_code: ${{ steps.release.outputs.version_code }}
      notification_title: ${{ steps.notification.outputs.notification_title }}
      notification_body: ${{ steps.notification.outputs.notification_body }}
      notification_route: ${{ steps.notification.outputs.notification_route }}
    concurrency:
      group: boxlore-release-metadata
      # Queue every metadata writer; the default single pending slot drops jobs.
      queue: max
      cancel-in-progress: false
    steps:
      - name: Generate boxlore pusher token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOXLORE_PUSHER_APP_ID }}
          private-key: ${{ secrets.BOXLORE_PUSHER_PRIVATE_KEY }}

      - name: Checkout master with release history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Resolve Latest GitHub release tag
        id: latest
        if: github.event.inputs.operation == 'refresh-latest-artifacts'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          latest_tag="$(gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName')"
          if [[ -z "$latest_tag" ]]; then
            echo "::error::No GitHub Latest release was found"
            exit 1
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Decide what to build and what is already published
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPERATION: ${{ github.event.inputs.operation == 'refresh-latest-artifacts' && 'refresh' || 'publish' }}
          BUILD_FROM: ${{ github.event.inputs.build_from }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          SKIP_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_notify || '' }}
        run: |
          args=(--operation "$OPERATION")
          if [[ "$OPERATION" == "refresh" ]]; then
            args+=(--latest-tag "$LATEST_TAG")
          elif [[ "$BUILD_FROM" == "latest-master" ]]; then
            args+=(--latest-master)
          fi
          python3 .github/scripts/prepare_release.py resolve-build "${args[@]}"

      # Set up from master before checking out the build commit, so the shared setup is always current.
      - name: Set up Android build tools
        if: steps.release.outputs.build == 'true'
        uses: ./.github/actions/android-setup
        with:
          sdk-packages: build-tools;36.0.0 platforms;android-37.0 cmdline-tools;latest
          google-services-stub: "false"

      # The update feed's text comes from master's README, so a re-run never brings back older wording.
      - name: Check out the commit to build
        env:
          BUILD_SHA: ${{ steps.release.outputs.build_sha }}
        run: |
          cp README.md "$RUNNER_TEMP/master-README.md"
          git checkout --quiet --detach "$BUILD_SHA"

      - name: Materialize protected build inputs
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BOXCAST_PUBLIC_KEY: ${{ secrets.BOXCAST_PUBLIC_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          BOXCAST_API_BASE_URL: ${{ vars.BOXCAST_API_BASE_URL }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          required = (
              "RELEASE_KEYSTORE_BASE64",
              "GOOGLE_SERVICES_JSON_BASE64",
              "KEY_STORE_PASSWORD",
              "KEY_PASSWORD",
              "BOXCAST_PUBLIC_KEY",
              "POSTHOG_API_KEY",
              "BOXCAST_API_BASE_URL",
              "POSTHOG_HOST",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing protected release values: " + ", ".join(missing)
              )

          def decode_secret(name: str, path: Path) -> None:
              try:
                  payload = base64.b64decode(
                      os.environ[name].strip(),
                      validate=True,
                  )
              except (ValueError, binascii.Error) as exc:
                  raise SystemExit(f"{name} is not valid Base64") from exc
              if not payload:
                  raise SystemExit(f"{name} decoded to an empty file")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(payload)
              path.chmod(0o600)

          def property_value(name: str) -> str:
              value = os.environ[name]
              if not value.isascii() or any(char in value for char in "\r\n"):
                  raise SystemExit(
                      f"{name} must be a single-line ASCII value"
                  )
              escaped = value.replace("\\", "\\\\")
              for char in ("=", ":", "#", "!"):
                  escaped = escaped.replace(char, f"\\{char}")
              if escaped.startswith(" "):
                  escaped = "\\ " + escaped[1:]
              return escaped

          decode_secret("RELEASE_KEYSTORE_BASE64", Path("app/release.keystore"))
          decode_secret(
              "GOOGLE_SERVICES_JSON_BASE64",
              Path("app/google-services.json"),
          )
          properties = {
              "KEY_STORE_PASSWORD": property_value("KEY_STORE_PASSWORD"),
              "KEY_PASSWORD": property_value("KEY_PASSWORD"),
              "BOXCAST_API_BASE_URL": property_value("BOXCAST_API_BASE_URL"),
              "BOXCAST_PUBLIC_KEY": property_value("BOXCAST_PUBLIC_KEY"),
              "posthog.apiKey": property_value("POSTHOG_API_KEY"),
              "posthog.host": property_value("POSTHOG_HOST"),
          }
          local_properties = Path("local.properties")
          local_properties.write_text(
              "".join(f"{key}={value}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          local_properties.chmod(0o600)
          PY

      - name: Verify release keystore identity
        if: steps.release.outputs.build == 'true'
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if ! [[ "$expected" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::RELEASE_CERT_SHA256 must be a 64-digit SHA-256 fingerprint"
            exit 1
          fi
          actual="$(
            keytool -list -v \
              -keystore app/release.keystore \
              -alias upload \
              -storepass:env KEY_STORE_PASSWORD 2>/dev/null |
              awk '/SHA256:/{print $2; exit}' |
              tr -d ':' |
              tr '[:lower:]' '[:upper:]'
          )"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Release keystore certificate fingerprint mismatch"
            exit 1
          fi

      - name: Build signed release APK and AAB
        if: steps.release.outputs.build == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundlePlayRelease

      - name: Verify optimized release contracts
        if: steps.release.outputs.build == 'true'
        run: |
          python3 .github/scripts/verify_release_contracts.py \
            --report app/build/reports/release-contracts.json \
            app/build/outputs/apk/release/app-release.apk
          python3 .github/scripts/verify_release_contracts.py \
            --app-variant playRelease \
            --report app/build/reports/play-release-contracts.json \
            app/build/outputs/bundle/playRelease/app-playRelease.aab

      - name: Preserve optimized release diagnostics
        if: always() && steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-contract-diagnostics-${{ steps.release.outputs.mode }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            app/build/reports/release-contracts.json
            app/build/reports/play-release-contracts.json
            app/build/outputs/mapping/release/configuration.txt
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/seeds.txt
            app/build/outputs/mapping/release/usage.txt
            app/build/outputs/mapping/release/missing_rules.txt
            app/build/outputs/mapping/playRelease/

      - name: Verify artifact versions and signatures
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/playRelease/app-playRelease.aab"
          [[ -s "$apk" ]] || { echo "::error::Signed release APK is missing"; exit 1; }
          [[ -s "$aab" ]] || { echo "::error::Signed release AAB is missing"; exit 1; }

          normalize_sha256() {
            printf '%s' "$1" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]'
          }

          # apksigner may wrap colon-separated digests across lines; a single-line
          # awk field previously produced apk_len=24 in CI.
          extract_sha256_digest() {
            printf '%s' "$1" | python3 .github/scripts/extract_cert_digest.py
          }

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not set"
            exit 1
          fi

          apkanalyzer="$(
            find "$sdk_root/cmdline-tools" -type f -name apkanalyzer 2>/dev/null |
              sort -V |
              awk 'END { print }'
          )"
          [[ -x "$apkanalyzer" ]] || {
            echo "::error::apkanalyzer not found under ${sdk_root}"
            exit 1
          }

          apksigner="$(
            find "$sdk_root/build-tools" -type f -name apksigner 2>/dev/null |
              sort -V |
              awk 'END { print }'
          )"
          [[ -x "$apksigner" ]] || {
            echo "::error::apksigner not found under ${sdk_root}/build-tools"
            ls -la "$sdk_root/build-tools" || true
            exit 1
          }
          echo "Using apksigner at ${apksigner}"

          apk_summary="$("$apkanalyzer" apk summary "$apk")"
          read -r apk_application_id apk_version_code apk_version <<< "$apk_summary"
          if [[ "$apk_application_id" != "cx.aswin.boxlore" ||
                "$apk_version_code" != "$EXPECTED_VERSION_CODE" ||
                "$apk_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::APK manifest does not match the release metadata"
            exit 1
          fi

          bundletool_json="$RUNNER_TEMP/bundletool-release.json"
          gh api repos/google/bundletool/releases/latest > "$bundletool_json"
          bundletool_url="$(
            jq -r '[.assets[] | select(.name | test("^bundletool-all-.*\\.jar$"))][0].browser_download_url // empty' \
              "$bundletool_json"
          )"
          bundletool_digest="$(
            jq -r '[.assets[] | select(.name | test("^bundletool-all-.*\\.jar$"))][0].digest // empty' \
              "$bundletool_json"
          )"
          if [[ -z "$bundletool_url" || ! "$bundletool_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Latest bundletool release has no verifiable JAR digest"
            exit 1
          fi
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location "$bundletool_url" --output "$bundletool"
          printf '%s  %s\n' "${bundletool_digest#sha256:}" "$bundletool" |
            sha256sum --check --status

          aab_version="$(
            java -jar "$bundletool" dump manifest \
              --bundle="$aab" \
              --xpath=/manifest/@android:versionName
          )"
          aab_version_code="$(
            java -jar "$bundletool" dump manifest \
              --bundle="$aab" \
              --xpath=/manifest/@android:versionCode
          )"
          if [[ "$aab_version" != "$EXPECTED_VERSION" ||
                "$aab_version_code" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "::error::AAB manifest does not match the release metadata"
            exit 1
          fi

          expected_cert="$(normalize_sha256 "$EXPECTED_CERT_SHA256")"
          if ! [[ "$expected_cert" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::RELEASE_CERT_SHA256 must be a 64-digit SHA-256 fingerprint"
            exit 1
          fi

          keystore_blob="$(
            keytool -list -v \
              -keystore app/release.keystore \
              -alias upload \
              -storepass:env KEY_STORE_PASSWORD 2>/dev/null
          )"
          keystore_cert="$(extract_sha256_digest "$keystore_blob")"

          # APK Signature Scheme v2/v3 is readable via apksigner, not keytool.
          apk_certs_blob="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          apk_cert="$(extract_sha256_digest "$apk_certs_blob")"

          # AABs still carry a JAR signature that keytool can read.
          # Do not use jarsigner -strict here: modern JDKs often exit 4 on
          # non-fatal algorithm/chain warnings even when the signature is valid.
          jarsigner -verify "$aab" >/dev/null
          aab_blob="$(keytool -printcert -jarfile "$aab" 2>/dev/null)"
          aab_cert="$(extract_sha256_digest "$aab_blob")"

          if ! [[ "$keystore_cert" =~ ^[0-9A-F]{64}$ &&
                  "$apk_cert" =~ ^[0-9A-F]{64}$ &&
                  "$aab_cert" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Could not parse one or more signing certificate digests"
            echo "keystore_len=${#keystore_cert} apk_len=${#apk_cert} aab_len=${#aab_cert}"
            echo "---- apksigner --print-certs (sanitized) ----"
            printf '%s\n' "$apk_certs_blob" | sed -E 's/([0-9A-Fa-f]{2}:){8,}/<digest>/g' | sed -n '1,40p'
            exit 1
          fi

          if [[ "$keystore_cert" != "$expected_cert" ||
                "$apk_cert" != "$expected_cert" ||
                "$aab_cert" != "$expected_cert" ]]; then
            echo "::error::Built artifact signing certificate mismatch"
            echo "expected=${expected_cert:0:8}…${expected_cert: -8}"
            echo "keystore=${keystore_cert:0:8}…${keystore_cert: -8}"
            echo "apk=${apk_cert:0:8}…${apk_cert: -8}"
            echo "aab=${aab_cert:0:8}…${aab_cert: -8}"
            exit 1
          fi
          echo "Verified APK/AAB signatures match release keystore ${expected_cert:0:8}…${expected_cert: -8}"

      - name: Stage release assets
        if: steps.release.outputs.build == 'true'
        env:
          APK_ASSET: ${{ steps.release.outputs.apk_asset }}
          AAB_ASSET: ${{ steps.release.outputs.aab_asset }}
          BUILD_SHA: ${{ steps.release.outputs.build_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/release-assets/$APK_ASSET"
          cp app/build/outputs/bundle/playRelease/app-playRelease.aab \
            "$RUNNER_TEMP/release-assets/$AAB_ASSET"
          (
            cd "$RUNNER_TEMP/release-assets"
            sha256sum "$APK_ASSET" "$AAB_ASSET" > SHA256SUMS
          )
          printf '%s\n' "$BUILD_SHA" > "$RUNNER_TEMP/release-assets/build-commit.txt"

      # A re-run after the files were published: use them, checked against their own SHA256SUMS.
      - name: Reuse the release's published files
        if: steps.release.outputs.build == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK_ASSET: ${{ steps.release.outputs.apk_asset }}
          AAB_ASSET: ${{ steps.release.outputs.aab_asset }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-assets" \
            --pattern "$APK_ASSET" --pattern "$AAB_ASSET" --pattern SHA256SUMS
          (
            cd "$RUNNER_TEMP/release-assets"
            sha256sum --check SHA256SUMS
          )
          echo "Reused ${TAG}'s published APK and AAB; nothing was built again." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notes
        if: steps.release.outputs.mode == 'publish'
        env:
          SKIP_NOTIFY: ${{ steps.release.outputs.skip_notify }}
        run: |
          notes_args=(--output "$RUNNER_TEMP/release-notes.md")
          if [[ "$SKIP_NOTIFY" == "true" ]]; then
            notes_args+=(--skip-notify)
          fi
          python3 .github/scripts/prepare_release.py notes \
            "${notes_args[@]}"

      - name: Prepare concise in-app announcement
        id: notification
        if: steps.release.outputs.mode == 'publish' && steps.release.outputs.skip_notify != 'true'
        run: python3 .github/scripts/prepare_release.py notification

      - name: Publish the files to the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODE: ${{ steps.release.outputs.mode }}
          RELEASE: ${{ steps.release.outputs.release }}
          TAG: ${{ steps.release.outputs.tag }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
          BUILD_SHA: ${{ steps.release.outputs.build_sha }}
          APK_ASSET: ${{ steps.release.outputs.apk_asset }}
          AAB_ASSET: ${{ steps.release.outputs.aab_asset }}
        run: |
          assets=(
            "$RUNNER_TEMP/release-assets/$APK_ASSET"
            "$RUNNER_TEMP/release-assets/$AAB_ASSET"
            "$RUNNER_TEMP/release-assets/SHA256SUMS"
            "$RUNNER_TEMP/release-assets/build-commit.txt"
          )
          case "$RELEASE" in
            keep)
              echo "${TAG} already holds these files."
              ;;
            upload)
              gh release upload "$TAG" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
              ;;
            create)
              if [[ "$TAG_EXISTS" == "true" ]]; then
                target_args=(--verify-tag)
              else
                target_args=(--target "$BUILD_SHA")
              fi
              gh release create "$TAG" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                "${target_args[@]}" \
                --title "$TAG" \
                --notes-file "$RUNNER_TEMP/release-notes.md" \
                --latest
              ;;
            *)
              echo "::error::Unknown release action: ${RELEASE}"
              exit 1
              ;;
          esac
          if [[ "$MODE" == "publish" ]]; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          else
            echo "Replaced ${TAG}'s APK, AAB, SHA256SUMS and build-commit.txt. The tag, notes and announcement are unchanged."
          fi

      - name: Verify README latest-download APK
        env:
          TAG: ${{ steps.release.outputs.tag }}
          APK_ASSET: ${{ steps.release.outputs.apk_asset }}
        run: |
          expected_apk="$RUNNER_TEMP/release-assets/$APK_ASSET"
          downloaded_apk="$RUNNER_TEMP/readme-latest-$APK_ASSET"
          expected_sha="$(sha256sum "$expected_apk" | awk '{print $1}')"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APK_ASSET}"

          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Cache-Control: no-cache" \
              "${download_url}?release=${TAG}&run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output "$downloaded_apk"; then
              downloaded_sha="$(sha256sum "$downloaded_apk" | awk '{print $1}')"
              if [[ "$downloaded_sha" == "$expected_sha" ]]; then
                echo "README latest-download URL serves the ${TAG} APK just published."
                exit 0
              fi
            fi
            echo "Latest-download APK has not propagated yet (attempt ${attempt}/12)."
            sleep 10
          done

          echo "::error::README latest-download URL does not serve the ${TAG} APK"
          exit 1

      - name: Publish verified update manifest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK_ASSET: ${{ steps.release.outputs.apk_asset }}
        run: |
          python3 .github/scripts/generate_update_manifest.py \
            --apk "$RUNNER_TEMP/release-assets/$APK_ASSET" \
            --readme "$RUNNER_TEMP/master-README.md" \
            --asset "$APK_ASSET" --output "$RUNNER_TEMP/update.json"
          gh release upload "$TAG" "$RUNNER_TEMP/update.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Verified updater manifest published. Same-version refreshes stay quiet."

      - name: Delete release branch after publish
        if: steps.release.outputs.mode == 'publish'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: python3 .github/scripts/prepare_release.py delete-release-branch --tag "$TAG"

      - name: Remove protected build inputs
        if: always()
        run: |
          rm -f local.properties
          rm -f app/release.keystore
          rm -f app/google-services.json

  # Rewrite the update feed's What's new and Coming next from master's README: no build, no new
  # version and no announcement. The same refresh runs after every merged PR; this runs it on demand.
  refresh-update-feed:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.operation == 'refresh-update-feed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: boxlore-release-metadata
      # Queue every metadata writer; the default single pending slot drops jobs.
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout master
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          persist-credentials: false

      - name: Refresh the update feed's text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          mkdir -p "$RUNNER_TEMP/update-feed"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir "$RUNNER_TEMP/update-feed"
          python3 .github/scripts/refresh_update_feed.py --manifest "$RUNNER_TEMP/update-feed/update.json"
          gh release upload "$TAG" "$RUNNER_TEMP/update-feed/update.json" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Updated ${TAG}'s What's new and Coming next. No APK changed and no notification was sent." >> "$GITHUB_STEP_SUMMARY"

  announce-release:
    name: Preview release announcement (no delivery)
    needs: publish-release
    if: >-
      needs.publish-release.result == 'success' &&
      needs.publish-release.outputs.mode == 'publish' &&
      needs.publish-release.outputs.skip_notify != 'true'
    uses: ./.github/workflows/send-notification.yml
    with:
      title: ${{ needs.publish-release.outputs.notification_title }}
      body: ${{ needs.publish-release.outputs.notification_body }}
      type: in-app
      route: ${{ needs.publish-release.outputs.notification_route }}
      image: ''
      target: direct_users
      dry_run: 'false'
      preview_only: 'true'
      release_url: ${{ format('https://github.com/boxcreate/boxlore/releases/tag/{0}', needs.publish-release.outputs.tag) }}
      release_alert: 'true'
      release_version_code: ${{ needs.publish-release.outputs.version_code }}
      presentation: fullscreen
      collapse_key: ${{ format('boxlore-release-{0}', needs.publish-release.outputs.tag) }}
      sound: silent
      action_label: Download
      show_action_in_push: 'false'
      show_action_in_app: 'true'
      category: NEW RELEASE
    secrets:
      FCM_SERVICE_ACCOUNT_KEY: ${{ secrets.FCM_SERVICE_ACCOUNT_KEY }}
