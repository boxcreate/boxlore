name: Release copy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: release-copy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Authored release copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check impact label and exact release wording
        run: python3 .github/scripts/update_changelog.py validate-copy
