title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for boxlore? Share it here so others can add to it. Ideas from listeners shape the roadmap.

  - type: dropdown
    id: area
    attributes:
      label: Which part of boxlore?
      options:
        - Playback, queue & miniplayer
        - Explore, Lore & recommendations
        - The boxlore brief
        - Library, downloads & episodes
        - RSS feeds, OPML & backup
        - Themes, layout & widgets
        - Performance
        - Something new or other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe your idea
      description: "What would you like to see, and how should it work?"
      placeholder: "I'd like a way to..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would it help?
      description: "How would it change the way you listen?"
      placeholder: "It would make it easier to..."
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: Visuals or examples
      description: "Mockups, screenshots, or examples from other apps that inspired the idea."
    validations:
      required: false
