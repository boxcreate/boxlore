title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Ask how something in boxlore works or what a setting does. If something looks broken, a bug report helps more.

  - type: dropdown
    id: category
    attributes:
      label: What is your question about?
      options:
        - How do I...
        - RSS feeds, OPML import & export
        - Downloads & storage
        - Accounts, backup & sync
        - Android Auto & car playback
        - Troubleshooting & device support
        - Something else
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      description: "The more specific the question, the easier it is to answer."
      placeholder: "How can I set up continuous playback for one show?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else that helps
      description: "App version, device, screenshots, or what you've already tried."
    validations:
      required: false
