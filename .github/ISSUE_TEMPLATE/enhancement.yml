name: Enhancement
description: Change or refine something boxlore already does
title: "[Enhancement]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this to suggest a change to something boxlore already does. For something new, use the feature request instead.

  - type: dropdown
    id: area
    attributes:
      label: Which part of boxlore?
      options:
        - Playback
        - Player screen
        - Search & Explore
        - Lore
        - Home & recommendations
        - The boxlore brief
        - Library & downloads
        - Onboarding
        - Widgets
        - Android Auto, Cast & other devices
        - iOS
        - Backend & catalog
        - Analytics
        - Performance
        - Developer / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: How it works today
      description: "Describe what boxlore does now."
      placeholder: "When I open a show, the newest episode is..."
    validations:
      required: true

  - type: textarea
    id: proposed-enhancement
    attributes:
      label: What you'd change
      description: "Describe the change you'd like to see."
      placeholder: "It would help if..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why it matters
      description: "What would this make easier, faster or clearer for you?"
      placeholder: "I'd get to the episode I want with one tap instead of three, because..."
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups, screenshots or examples
      description: "Sketches, mockups, or how another app handles it."
    validations:
      required: false
