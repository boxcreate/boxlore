name: Release copy

# Every PR event: apply the impact labels the PR body's checkboxes pick (when the PR is opened or its
# body edited), then check the impact label and the exact release wording against the labels as they
# are now. One job, so the check never runs before the labels it needs are applied (labels applied with
# the workflow token start no new run).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-copy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Authored release copy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply impact labels from the PR body
        if: github.event.action == 'opened' || github.event.action == 'edited'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const number = pr.number;
            const body = (pr.body || '').trim();
            const currentLabels = (pr.labels || []).map(l => typeof l === 'string' ? l : l.name);

            const labelsToAdd = new Set();
            const labelsToRemove = new Set();

            const impactLabels = [
              'user-impact-critical',
              'user-impact-high',
              'user-impact-medium',
              'user-impact-low',
              'no-user-impact'
            ];

            // 1. Infer user impact from checkboxes: - [x] `user-impact-...`
            let checkedImpact = null;
            for (const impact of impactLabels) {
              const regex = new RegExp(`-\\s*\\[[xX]\\]\\s*(\`?)${impact}\\1`, 'i');
              if (regex.test(body)) {
                checkedImpact = impact;
                break;
              }
            }

            if (checkedImpact) {
              for (const impact of impactLabels) {
                if (impact === checkedImpact) {
                  if (!currentLabels.includes(impact)) labelsToAdd.add(impact);
                } else if (currentLabels.includes(impact)) {
                  labelsToRemove.add(impact);
                }
              }
            }

            // 2. Infer backend-change from checkbox
            const backendRegex = /-\s*\[[xX]\]\s*(`?)backend-change\1/i;
            if (backendRegex.test(body) && !currentLabels.includes('backend-change')) {
              labelsToAdd.add('backend-change');
            }

            // Remove superseded labels
            for (const label of labelsToRemove) {
              console.log(`Removing superseded label from #${number}: ${label}`);
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  name: label
                });
              } catch (e) {
                console.warn(`Could not remove label ${label}:`, e.message);
              }
            }

            // Add new labels
            const finalToAdd = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));
            if (finalToAdd.length > 0) {
              console.log(`Adding labels to #${number}:`, finalToAdd);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                labels: finalToAdd
              });
            } else {
              console.log(`No new labels to add for #${number}.`);
            }

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read the PR's labels as they are now
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "json=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '[.[].name]' | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Check impact label and exact release wording
        env:
          PR_LABELS_JSON: ${{ steps.labels.outputs.json }}
        run: python3 .github/scripts/update_changelog.py validate-copy
