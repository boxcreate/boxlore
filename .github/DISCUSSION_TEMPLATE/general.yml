title: "[General]: "
body:
  - type: markdown
    attributes:
      value: |
        Talk about anything boxlore: a show you found, how you like to listen, or what you think of a recent update.

  - type: textarea
    id: topic
    attributes:
      label: What's on your mind?
      description: "What would you like to talk about?"
      placeholder: "A show I found through Lore, the theme I settled on, thoughts on the latest update..."
    validations:
      required: true
