name: Crash or freeze report
description: boxlore closed unexpectedly, froze, or showed an "isn't responding" (ANR) message
title: "[Crash]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Crashes and freezes are among the first things we look at. A stack trace and the steps that led up to it help most.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: "Find it in Settings > About, or in Android's app info for boxlore."
      placeholder: "e.g. 0.0.28"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: "Your phone or tablet model and the Android version it runs."
      placeholder: "e.g. Pixel 7 Pro, Android 14"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where were you in boxlore?
      options:
        - Playback
        - Player screen
        - Library & downloads
        - Search & Explore
        - Lore
        - Home & recommendations
        - The boxlore brief
        - Onboarding
        - Widgets
        - Android Auto, Cast & other devices
        - Backend & catalog
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - "Every time I try"
        - "Often, under certain conditions"
        - "Sometimes, and it's hard to reproduce"
        - "It happened once"
    validations:
      required: true

  - type: textarea
    id: stacktrace
    attributes:
      label: Crash log or stack trace
      description: "Paste the Android crash log or logcat output, if you have it."
      placeholder: |
        FATAL EXCEPTION: main
        java.lang.NullPointerException: ...
      render: shell
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "What were you doing right before it crashed or froze?"
      placeholder: |
        1. Open boxlore
        2. Tap ...
        3. boxlore closes
    validations:
      required: true

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Before you submit
      options:
        - label: "This happens on the latest release of boxlore."
          required: true
