name: Android CI setup
description: >
  JDK 17, Gradle with the GitHub Actions cache, and the CI stub google-services.json, for the
  Android jobs of the unit suite. Only `master` saves the Gradle cache: pull requests read it, so
  their many short-lived copies don't push master's out of the repository's cache space.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}

    # Real google-services.json lives in the GitHub Environment "release"
    # (GOOGLE_SERVICES_JSON_BASE64) and is not available to PR/push CI.
    # This stub only satisfies the Google Services Gradle plugin for unit tests.
    - name: Write CI stub google-services.json
      uses: ./.github/actions/write-ci-google-services
