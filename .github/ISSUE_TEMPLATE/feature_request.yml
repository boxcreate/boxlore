name: 💡 Feature Request
description: Propose a new feature, improvement, or idea for boxlore
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make boxlore even better? We'd love to hear your suggestions! 🎧

  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      options:
        - Playback
        - Player UI
        - Search & Explore
        - Home & Recommendations
        - Library & Offline
        - Onboarding
        - Widgets
        - Platform (Wear/TV/Tablet/Cast)
        - iOS
        - Backend & Catalog
        - Analytics
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: "What would you like to see added or changed? Be as clear as possible."
      placeholder: "I would like boxlore to support..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem & Motivation
      description: "What problem does this solve for your listening experience?"
      placeholder: "Currently, when I want to do X, I have to..."
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups, Screenshots, or References
      description: "Any concept sketches, mockups, or examples from other podcast apps"
    validations:
      required: false
