name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in boxlore
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so we can track and resolve it quickly.

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: "Which version of boxlore are you running? (Found in Settings > About or app info page)"
      placeholder: "e.g. v0.0.24"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device & Android Version
      description: "Your device model and operating system version"
      placeholder: "e.g. Pixel 8 (Android 15), Samsung S23 (One UI 6.1)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area is affected?
      description: "Matches roadmap project categories"
      options:
        - Playback
        - Player UI
        - Search & Explore
        - Home & Recommendations
        - Library & Offline
        - Onboarding
        - Widgets
        - Platform (Wear/TV/Tablet/Cast)
        - Backend & Catalog
        - Developer / CI
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity / Urgency
      description: "How severely does this affect listening?"
      options:
        - "Minor / Cosmetic (UI glitch, minor styling, or edge case) -> P3"
        - "Standard Bug (Normal feature impaired, workaround exists) -> P2"
        - "Critical / Blocking (Audio broken, crash, or data loss) -> P1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: "Describe the bug clearly. What did you expect vs what actually happened?"
      placeholder: "When I open a show with 500+ episodes, the episode list flickers and..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Step-by-step instructions to reproduce the issue"
      placeholder: |
        1. Launch boxlore
        2. Go to 'Library' tab
        3. Tap on show '...'
        4. Observe ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Trace
      description: "If you have logcat output or error logs, paste them here"
      render: shell
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots / Screen Recording
      description: "Drag and drop any screenshots or screen recordings that help illustrate the issue"
    validations:
      required: false

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: "I have verified this issue exists on the latest release of boxlore."
          required: true
        - label: "I searched existing GitHub issues and confirmed this is not a duplicate."
          required: false
