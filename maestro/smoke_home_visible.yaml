appId: cx.aswin.boxlore
---
- launchApp
- tapOn:
    text: ".*(Accept|Allow|Continue|Skip|Not now).*"
    optional: true
# Cold-start visibility smoke. Primary gate matches smoke_launch (strict).
- extendedWaitUntil:
    visible:
      id: "home_settings_button"
    timeout: 20000
- assertVisible:
    id: "home_settings_button"
# Floating navigation retains stable pill labels and the Lore accessibility name (strict).
- assertVisible:
    text: "Home"
- assertVisible:
    text: "Explore"
- assertVisible:
    text: "Library"
- assertVisible: "Lore"
