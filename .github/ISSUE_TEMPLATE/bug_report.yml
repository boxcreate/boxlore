name: Bug report
description: Something in boxlore doesn't work the way it should
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. One bug per report, with as much detail as you can, helps it get fixed sooner.

        If boxlore closed or froze, use the crash report instead. To report a security issue, use the private security link on the previous page.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: "Find it in Settings > About, or in Android's app info for boxlore."
      placeholder: "e.g. 0.0.28"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: "Your phone or tablet model and the Android version it runs."
      placeholder: "e.g. Pixel 8, Android 15 or Galaxy S23, One UI 6.1"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where in boxlore?
      options:
        - Playback
        - Player screen
        - Search & Explore
        - Lore
        - Home & recommendations
        - The boxlore brief
        - Library & downloads
        - Onboarding
        - Widgets
        - Android Auto, Cast & other devices
        - Backend & catalog
        - Developer / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: "What did you expect, and what happened instead?"
      placeholder: "When I open a show with more than 500 episodes, the episode list flickers."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "The steps that lead to the bug, starting from opening boxlore."
      placeholder: |
        1. Open boxlore
        2. Go to Library
        3. Tap the show '...'
        4. See ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: "If you have logcat output or an error log, paste it here."
      render: shell
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: "Drag screenshots or a short recording here. A recording often shows what words can't."
    validations:
      required: false

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Before you submit
      options:
        - label: "This happens on the latest release of boxlore."
          required: true
        - label: "I searched existing issues, and this isn't a duplicate."
          required: false
