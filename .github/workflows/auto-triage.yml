name: Auto-Triage & Labeler

on:
  pull_request:
    types: [opened, edited]

concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  triage:
    name: Auto-Triage
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Evaluate and apply CI labels from PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const number = pr.number;
            const body = (pr.body || '').trim();
            const currentLabels = (pr.labels || []).map(l => typeof l === 'string' ? l : l.name);

            const labelsToAdd = new Set();
            const labelsToRemove = new Set();

            const impactLabels = [
              'user-impact-critical',
              'user-impact-high',
              'user-impact-medium',
              'user-impact-low',
              'no-user-impact'
            ];

            // 1. Infer user impact from checkboxes: - [x] `user-impact-...`
            let checkedImpact = null;
            for (const impact of impactLabels) {
              const regex = new RegExp(`-\\s*\\[[xX]\\]\\s*(\`?)${impact}\\1`, 'i');
              if (regex.test(body)) {
                checkedImpact = impact;
                break;
              }
            }

            if (checkedImpact) {
              for (const impact of impactLabels) {
                if (impact === checkedImpact) {
                  if (!currentLabels.includes(impact)) labelsToAdd.add(impact);
                } else if (currentLabels.includes(impact)) {
                  labelsToRemove.add(impact);
                }
              }
            }

            // 2. Infer backend-change from checkbox
            const backendRegex = /-\s*\[[xX]\]\s*(`?)backend-change\1/i;
            if (backendRegex.test(body) && !currentLabels.includes('backend-change')) {
              labelsToAdd.add('backend-change');
            }

            // Remove superseded labels
            for (const label of labelsToRemove) {
              console.log(`Removing superseded label from #${number}: ${label}`);
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  name: label
                });
              } catch (e) {
                console.warn(`Could not remove label ${label}:`, e.message);
              }
            }

            // Add new labels
            const finalToAdd = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));
            if (finalToAdd.length > 0) {
              console.log(`Adding labels to #${number}:`, finalToAdd);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                labels: finalToAdd
              });
            } else {
              console.log(`No new labels to add for #${number}.`);
            }
