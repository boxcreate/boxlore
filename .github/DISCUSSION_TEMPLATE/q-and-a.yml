title: "❓ [Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Have a question about using boxlore? Can't figure out a feature or setting? Ask the community here! 🙋

  - type: dropdown
    id: category
    attributes:
      label: What is your question related to?
      options:
        - How-to & Usage Tips
        - OPML Import / Export / Feeds
        - Downloads & Storage
        - Android Auto & Car Playback
        - Troubleshooting & Device Compatibility
        - General Question
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      description: "Be as specific as possible so other community members can help."
      placeholder: "How can I set up continuous playback for a specific show?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "App version, device model, screenshots, or any steps you've already tried."
    validations:
      required: false
