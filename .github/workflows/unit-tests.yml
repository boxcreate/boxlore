name: Unit Tests

# Runs on:
# - `pull_request` — every PR push (new commits cancel the previous in-progress run)
# - `push` to `master` — refreshes the GitHub Actions Gradle caches that PR runs read
# - `workflow_dispatch` — manual full gate (always runs; ignores [skip unit] and docs-only changes)
# The suite runs as parallel jobs: static checks, unit tests in four shards (app, core, and the feature
# modules in two groups of similar test weight), merged coverage over the shards' results, and lint in
# three shards (app, core, features). `testDebugUnitTest`,
# the check the master ruleset requires, passes only when every one of them passed.
# Put `[skip unit]` in the PR title to no-op (still reports green as `testDebugUnitTest`); a PR that
# changes only documentation skips the Android jobs on its own. Use these only with no logic risk.
# Bot pushes to master use boxlore-master-pusher (ruleset Integration bypass).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# One active run per PR / ref — a new commit cancels the previous in-progress run.
concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The feature modules with the heaviest tests; the others run in the features-b shard, so a new
  # feature module lands there without a workflow change. Keep the two groups' run times similar.
  FEATURES_A: '^:feature:(home|player|library|widgets|history|briefing)$'

jobs:
  changes:
    name: Detect Skip Condition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip for [skip unit] or a docs-only PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if echo "$PR_TITLE" | grep -qi '\[skip unit\]'; then
              skip=true
              echo "Skipped via [skip unit] in the PR title."
            else
              files="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
              # Documentation: Markdown outside source sets, docs/, screenshots/ and the license.
              code="$(printf '%s\n' "$files" | awk 'NF && !((/\.md$/ && !/\/src\//) || /^docs\// || /^screenshots\// || /^LICENSE$/)')"
              if [ -n "$files" ] && [ -z "$code" ]; then
                skip=true
                echo "Only documentation changed; the Android jobs are skipped:"
                printf '%s\n' "$files"
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node for announcement preview checks
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Announcement composer contract checks
        run: node --test .github/scripts/test_announcement_admin.cjs
      - name: Changelog and release-note script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Architecture boundary checks
        run: |
          bash scripts/ci/check-feature-no-boxlore-database.sh
          bash scripts/ci/check-feature-no-posthog.sh

      - name: Every module belongs to a test shard
        run: |
          set -euo pipefail
          other="$(grep -oE 'include\("[^"]+"\)' settings.gradle.kts | sed -E 's/include\("(.*)"\)/\1/' | grep -vE '^(:app|:core:.+|:feature:.+)$' || true)"
          if [ -n "$other" ]; then
            echo "::error::Add these modules to a shard in .github/workflows/unit-tests.yml: ${other}"
            exit 1
          fi

      - uses: ./.github/actions/android-setup
      - name: Detekt and dependency guards
        run: ./gradlew detekt :app:dependencyGuard :core:catalog:dependencyGuard :core:playback:dependencyGuard --continue

  tests:
    name: Unit tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [app, core, features-a, features-b]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup

      # Robolectric downloads an Android runtime jar per test SDK into ~/.m2 when tests start, and a
      # failed download fails every test that needs it. Keep the jars per shard; the key changes with
      # the Robolectric version and the set of SDKs tests pin. Only master saves, like the Gradle cache.
      - name: Robolectric cache key
        id: robolectric-key
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^robolectric = "([^"]+)"/\1/p' gradle/libs.versions.toml)"
          sdks="$(grep -rhoE 'sdk *= *\[[0-9, ]+\]' --include='*.kt' . | tr -d ' ' | sort -u | sha256sum | cut -c1-12)"
          echo "key=robolectric-${SHARD}-${version}-${sdks}" >> "$GITHUB_OUTPUT"
      - name: Restore Robolectric runtime jars
        id: robolectric-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-key.outputs.key }}

      - name: Unit tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          modules() { grep -oE 'include\("[^"]+"\)' settings.gradle.kts | sed -E 's/include\("(.*)"\)/\1/'; }
          case "$SHARD" in
            app) selected="$(modules | grep -E '^:app$')" ;;
            core) selected="$(modules | grep -E '^:core:')" ;;
            features-a) selected="$(modules | grep -E "$FEATURES_A")" ;;
            features-b) selected="$(modules | grep -E '^:feature:' | grep -vE "$FEATURES_A")" ;;
          esac
          tasks="$(printf '%s\n' "$selected" | sed 's/$/:testDebugUnitTest/' | tr '\n' ' ')"
          echo "Running: $tasks"
          ./gradlew $tasks --continue

      - name: Save Robolectric runtime jars
        if: success() && github.ref == 'refs/heads/master' && steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-key.outputs.key }}

      # Each test task writes its coverage (Kover's binary report); the coverage job merges every shard's.
      - name: Pack coverage data
        run: find . -path '*/build/kover/bin-reports/*.ic' -print0 | tar --null -czf "kover-${{ matrix.shard }}.tgz" --files-from=-
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: kover-${{ matrix.shard }}
          path: kover-${{ matrix.shard }}.tgz
          retention-days: 1

  coverage:
    name: Coverage
    needs: [changes, tests]
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup

      - name: Download the shards' coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: kover-*
          path: ${{ runner.temp }}/kover
          merge-multiple: true
      - name: Unpack coverage data
        run: for pack in "$RUNNER_TEMP"/kover/*.tgz; do tar -xzf "$pack"; done

      # The tests already ran in the shards: verify the merged floor from their coverage data.
      - name: Merged coverage floor
        run: ./gradlew :koverVerifyMerged -x testDebugUnitTest

  lint-debug:
    name: Lint Debug (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [app, core, features]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup

      - name: Lint debug
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          modules() { grep -oE 'include\("[^"]+"\)' settings.gradle.kts | sed -E 's/include\("(.*)"\)/\1/'; }
          case "$SHARD" in
            app) prefix='^:app$' ;;
            core) prefix='^:core:' ;;
            features) prefix='^:feature:' ;;
          esac
          tasks="$(modules | grep -E "$prefix" | sed 's/$/:lintDebug/' | tr '\n' ' ')"
          echo "Running: $tasks"
          ./gradlew $tasks --continue

  testDebugUnitTest:
    name: testDebugUnitTest
    needs: [changes, static, tests, coverage, lint-debug]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Check Suite
        env:
          CHANGES: ${{ needs.changes.result }}
          SKIP: ${{ needs.changes.outputs.skip }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          COVERAGE: ${{ needs.coverage.result }}
          LINT: ${{ needs.lint-debug.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" = "success" ] && [ "$SKIP" = "true" ]; then
            echo "Suite skipped ([skip unit] in the PR title, or a docs-only PR)."
            exit 0
          fi
          echo "Static checks: $STATIC; unit tests: $TESTS; coverage: $COVERAGE; lint: $LINT"
          for result in "$CHANGES" "$STATIC" "$TESTS" "$COVERAGE" "$LINT"; do
            if [ "$result" != "success" ]; then
              echo "::error::One or more required CI check jobs did not pass (static: $STATIC, tests: $TESTS, coverage: $COVERAGE, lint: $LINT)."
              exit 1
            fi
          done
          echo "All required tests, linters, and quality gates passed successfully."
